<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; }
        header { background-color: #1a365d; color: white; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #3182ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>{{ title }}</h1>
    </header>

    <div class="container">
        <a href="/" class="back-link">&larr; Back to Home</a>
        <p>{{ content }}</p>
    </div>

</body>
</html>
