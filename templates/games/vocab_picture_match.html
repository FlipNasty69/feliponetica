<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ set_title }} | Vocabulary Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f7f9fa;
      --card-bg: #fff;
      --text-main: #4b4b4b;
      --green-main: #58cc02;
      --green-shadow: #46a302;
      --blue-main: #1cb0f6;
      --blue-shadow: #1899d6;
      --red-main: #ff4b4b;
      --gray-light: #e5e5e5;
      --gray-shadow: #afafaf;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: "Nunito", sans-serif;
    }
    button { font: inherit; }
    .game-container {
      width: min(1120px, 100%);
      padding: 24px;
      border: 2px solid var(--gray-light);
      border-bottom-width: 5px;
      border-radius: 20px;
      background: var(--card-bg);
    }
    .header-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .stage-badge { color: var(--blue-main); font-size: 14px; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
    .progress-outer { flex: 1; height: 16px; overflow: hidden; border-radius: 10px; background: var(--gray-light); }
    .progress-inner { width: 0; height: 100%; border-radius: inherit; background: var(--green-main); transition: width .25s ease; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(26px, 4vw, 36px); text-align: center; }
    .instructions { margin-bottom: 22px; color: #666; text-align: center; }
    .learn-card { max-width: 560px; margin: 0 auto; text-align: center; }
    .learn-image {
      display: block;
      width: min(100%, 420px);
      height: 300px;
      margin: 0 auto 16px;
      border: 2px solid var(--gray-light);
      border-radius: 18px;
      background: #fff;
      object-fit: contain;
    }
    .learn-word { margin: 0; font-size: clamp(28px, 5vw, 42px); font-weight: 900; }
    .learn-phonetic { margin: 4px 0 18px; color: var(--blue-main); font-size: 22px; font-weight: 800; }
    .duo-btn {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: 0;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
    }
    .duo-btn:focus-visible, .image-target:focus-visible, .word-tile:focus-visible {
      outline: 3px solid #17305f;
      outline-offset: 3px;
    }
    .btn-green { background: var(--green-main); box-shadow: 0 4px 0 var(--green-shadow); color: #fff; }
    .btn-green:active { transform: translateY(3px); box-shadow: none; }
    .learn-card .duo-btn { width: 100%; }
    .match-board { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .match-column { min-width: 0; }
    .match-column h2 { margin-bottom: 12px; font-size: 20px; text-align: center; }
    .image-grid, .word-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .image-target {
      min-width: 0;
      min-height: 144px;
      padding: 9px;
      border: 2px solid var(--gray-light);
      border-bottom-width: 5px;
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .image-target img { display: block; width: 100%; height: 104px; object-fit: contain; }
    .image-target.is-over { border-color: var(--blue-main); background: #ddf4ff; }
    .image-target.is-correct { border-color: var(--green-main); background: #e9f9dc; cursor: default; }
    .image-target.is-wrong { border-color: var(--red-main); animation: shake .22s linear; }
    .matched-word { display: block; margin-top: 5px; color: #347900; font-size: 14px; font-weight: 900; }
    .matched-phonetic, .word-phonetic { display: block; margin-top: 2px; color: var(--blue-main); font-size: 12px; font-weight: 800; }
    .word-tile {
      display: flex;
      min-height: 58px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border: 2px solid var(--gray-light);
      border-bottom-width: 5px;
      border-radius: 14px;
      background: #fff;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 900;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .word-tile:hover, .word-tile.is-selected { border-color: var(--blue-main); background: #ddf4ff; }
    .word-tile:active { cursor: grabbing; }
    .word-tile.is-matched { display: none; }
    .match-message { min-height: 30px; margin: 18px 0 0; font-weight: 900; text-align: center; }
    .match-message.is-error { color: #c62828; }
    .match-message.is-success { color: #347900; }
    .finished {
      padding: 32px 16px;
      border-radius: 18px;
      background: #e9f9dc;
      text-align: center;
    }
    .finished h2 { margin-bottom: 8px; color: #347900; font-size: 30px; }
    .hidden { display: none !important; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @media (max-width: 700px) {
      body { padding: 12px; place-items: start center; }
      .game-container { padding: 16px; }
      .match-board { grid-template-columns: 1fr; gap: 22px; }
      .image-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .word-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 380px) {
      .image-grid, .word-grid { gap: 8px; }
      .image-target { min-height: 124px; padding: 6px; }
      .image-target img { height: 88px; }
      .word-tile { padding: 8px 5px; font-size: 14px; }
      .stage-badge { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="game-container">
    <header class="header-bar">
      <span class="stage-badge" id="stageBadge">Learn 1 / 16</span>
      <div class="progress-outer" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="32" aria-valuenow="0">
        <div class="progress-inner" id="progressBar"></div>
      </div>
    </header>

    <section id="learningScreen" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Learn the words</h1>
      <p class="instructions">Look at each picture, read the English word, then continue.</p>
      <div class="learn-card">
        <img class="learn-image" id="learnImage" src="" alt="" loading="lazy" decoding="async">
        <p class="learn-word" id="learnWord"></p>
        <p class="learn-phonetic" id="learnPhonetic"></p>
        <button class="duo-btn btn-green" id="nextButton" type="button">Next</button>
      </div>
    </section>

    <section id="matchingScreen" class="hidden" aria-labelledby="matchingTitle">
      <h1 id="matchingTitle">Match each picture</h1>
      <p class="instructions">Drag each English word onto its picture. On a touch screen, tap a word and then its picture.</p>
      <div class="match-board">
        <section class="match-column" aria-labelledby="imagesTitle">
          <h2 id="imagesTitle">Images</h2>
          <div class="image-grid" id="imageGrid"></div>
        </section>
        <section class="match-column" aria-labelledby="wordsTitle">
          <h2 id="wordsTitle">Words</h2>
          <div class="word-grid" id="wordGrid"></div>
        </section>
      </div>
      <p class="match-message" id="matchMessage" role="status" aria-live="polite"></p>
      <div class="finished hidden" id="finishedMessage" role="status">
        <h2>Great work!</h2>
        <p>You matched every word to its picture.</p>
        <button class="duo-btn btn-green" id="alongButton" type="button">Along</button>
      </div>
    </section>
  </main>

  <script>
    const vocabItems = {{ words | tojson }};
    const learningScreen = document.getElementById("learningScreen");
    const matchingScreen = document.getElementById("matchingScreen");
    const learnImage = document.getElementById("learnImage");
    const learnWord = document.getElementById("learnWord");
    const learnPhonetic = document.getElementById("learnPhonetic");
    const stageBadge = document.getElementById("stageBadge");
    const progressBar = document.getElementById("progressBar");
    const progressOuter = document.querySelector(".progress-outer");
    const imageGrid = document.getElementById("imageGrid");
    const wordGrid = document.getElementById("wordGrid");
    const matchMessage = document.getElementById("matchMessage");
    const finishedMessage = document.getElementById("finishedMessage");
    let learnIndex = 0;
    let matchedCount = 0;
    let selectedWordId = null;
    let activePointerDrag = null;
    let activePointerTarget = null;

    function updateProgress(value, label) {
      stageBadge.textContent = label;
      progressBar.style.width = `${(value / (vocabItems.length * 2)) * 100}%`;
      progressOuter.setAttribute("aria-valuenow", String(value));
    }

    function showLearningItem() {
      const item = vocabItems[learnIndex];
      learnImage.src = item.image;
      learnImage.alt = item.english;
      learnWord.textContent = item.english;
      learnPhonetic.textContent = item.phonetic || "";
      document.getElementById("nextButton").textContent =
        learnIndex === vocabItems.length - 1 ? "Start matching" : "Next";
      updateProgress(learnIndex + 1, `Learn ${learnIndex + 1} / ${vocabItems.length}`);
    }

    function startMatching() {
      learningScreen.classList.add("hidden");
      matchingScreen.classList.remove("hidden");
      updateProgress(vocabItems.length, `Match 0 / ${vocabItems.length}`);
      renderMatchItems();
    }

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function renderMatchItems() {
      vocabItems.forEach((item, index) => {
        const target = document.createElement("button");
        target.type = "button";
        target.className = "image-target";
        target.dataset.wordId = item.id;
        target.setAttribute("aria-label", `Picture ${index + 1} of ${vocabItems.length}, drop the matching word here`);

        const image = document.createElement("img");
        image.src = item.image;
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";
        target.appendChild(image);
        target.addEventListener("click", () => {
          if (selectedWordId) tryMatch(target, selectedWordId);
        });
        imageGrid.appendChild(target);
      });

      shuffled(vocabItems).forEach(item => {
        const word = document.createElement("button");
        word.type = "button";
        word.className = "word-tile";
        word.dataset.wordId = item.id;
        word.setAttribute("aria-label", item.phonetic
          ? `${item.english}, ${item.phonetic}`
          : item.english);
        const label = document.createElement("span");
        label.textContent = item.english;
        word.appendChild(label);
        if (item.phonetic) {
          const phonetic = document.createElement("span");
          phonetic.className = "word-phonetic";
          phonetic.textContent = item.phonetic;
          word.appendChild(phonetic);
        }
        word.addEventListener("dragstart", event => event.preventDefault());
        word.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          activePointerDrag = {
            wordId: item.id,
            source: word,
            startX: event.clientX,
            startY: event.clientY,
            moved: false
          };
        });
        word.addEventListener("click", () => {
          if (selectedWordId === item.id) {
            selectedWordId = null;
            word.classList.remove("is-selected");
            matchMessage.textContent = "Word selection cleared.";
            matchMessage.className = "match-message";
            return;
          }
          selectedWordId = item.id;
          document.querySelectorAll(".word-tile").forEach(tile => tile.classList.remove("is-selected"));
          word.classList.add("is-selected");
          matchMessage.textContent = `${item.english} selected. Now tap its picture.`;
          matchMessage.className = "match-message";
        });
        wordGrid.appendChild(word);
      });
    }

    document.addEventListener("pointermove", event => {
      if (!activePointerDrag) return;
      const drag = activePointerDrag;
      if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 8) return;
      drag.moved = true;
      selectedWordId = drag.wordId;
      drag.source.classList.add("is-selected");
      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".image-target") || null;
      if (activePointerTarget !== target) {
        activePointerTarget?.classList.remove("is-over");
        activePointerTarget = target;
        if (target && !target.classList.contains("is-correct")) target.classList.add("is-over");
      }
    });

    document.addEventListener("pointerup", event => {
      if (!activePointerDrag) return;
      const drag = activePointerDrag;
      activePointerDrag = null;
      if (!drag.moved) return;
      const target = document.elementFromPoint(event.clientX, event.clientY)?.closest(".image-target");
      activePointerTarget?.classList.remove("is-over");
      activePointerTarget = null;
      drag.source.classList.remove("is-selected");
      selectedWordId = null;
      if (target) tryMatch(target, drag.wordId);
      event.preventDefault();
    });

    document.addEventListener("pointercancel", () => {
      activePointerDrag?.source.classList.remove("is-selected");
      activePointerDrag = null;
      activePointerTarget?.classList.remove("is-over");
      activePointerTarget = null;
      selectedWordId = null;
    });

    function tryMatch(target, wordId) {
      if (!wordId || target.classList.contains("is-correct")) return;
      if (target.dataset.wordId !== wordId) {
        matchMessage.textContent = "Not a match. Try another picture.";
        matchMessage.className = "match-message is-error";
        target.classList.remove("is-wrong");
        void target.offsetWidth;
        target.classList.add("is-wrong");
        window.setTimeout(() => target.classList.remove("is-wrong"), 300);
        return;
      }

      const item = vocabItems.find(entry => entry.id === wordId);
      target.classList.add("is-correct");
      target.setAttribute("aria-label", `${item.english} picture, matched`);
      const label = document.createElement("span");
      label.className = "matched-word";
      label.textContent = item.english;
      target.appendChild(label);
      if (item.phonetic) {
        const phonetic = document.createElement("span");
        phonetic.className = "matched-phonetic";
        phonetic.textContent = item.phonetic;
        target.appendChild(phonetic);
      }
      const wordTile = wordGrid.querySelector(`[data-word-id="${CSS.escape(wordId)}"]`);
      wordTile.classList.add("is-matched");
      wordTile.classList.remove("is-selected");
      selectedWordId = null;
      matchedCount++;
      updateProgress(vocabItems.length + matchedCount, `Match ${matchedCount} / ${vocabItems.length}`);
      matchMessage.textContent = `Correct: ${item.english}!`;
      matchMessage.className = "match-message is-success";

      if (matchedCount === vocabItems.length) {
        matchMessage.classList.add("hidden");
        finishedMessage.classList.remove("hidden");
        updateProgress(vocabItems.length * 2, "Complete");
      }
    }

    document.getElementById("nextButton").addEventListener("click", () => {
      if (learnIndex === vocabItems.length - 1) {
        startMatching();
        return;
      }
      learnIndex++;
      showLearningItem();
    });

    document.getElementById("alongButton").addEventListener("click", () => {
      window.location.href = {{ next_url | tojson }};
    });

    showLearningItem();
  </script>
</body>
</html>
