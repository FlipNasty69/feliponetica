<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ set_title }} | Vocabulary Game</title>
  <style>
    :root {
      --bg: #f7f9fa;
      --card: #fff;
      --ink: #343b45;
      --blue: #1cb0f6;
      --green: #58cc02;
      --green-dark: #46a302;
      --red: #c62828;
      --line: #e5e5e5;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito", "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .game { width: min(1120px, 100%); padding: 24px; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px; background: var(--card); }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .stage { color: #168bc2; font-size: 14px; font-weight: 900; }
    .progress { flex: 1; height: 14px; overflow: hidden; border-radius: 10px; background: var(--line); }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--green); transition: width .2s ease; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(26px, 4vw, 36px); text-align: center; }
    .instructions { margin-bottom: 22px; color: #626a73; text-align: center; }
    .set-picker { max-width: 560px; margin: 0 auto 24px; text-align: center; }
    .set-picker select { width: 100%; min-height: 48px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px; background: white; color: var(--ink); font: inherit; }
    .set-error { min-height: 24px; margin: 12px 0 0; color: var(--red); font-weight: 800; }
    .learn-card { max-width: 560px; margin: auto; text-align: center; }
    .learn-images { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; margin-bottom: 16px; }
    .learn-images img { display: block; width: 100%; height: 260px; border: 2px solid var(--line); border-radius: 18px; object-fit: contain; }
    .learn-word { margin: 0 0 14px; font-size: clamp(30px, 5vw, 44px); font-weight: 900; }
    .primary, .audio-button {
      min-height: 50px;
      padding: 11px 22px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      box-shadow: 0 4px 0 var(--green-dark);
      color: white;
      font-weight: 900;
      cursor: pointer;
    }
    .primary { width: 100%; margin-top: 14px; text-transform: uppercase; }
    .primary:active, .audio-button:active { transform: translateY(3px); box-shadow: none; }
    button:focus-visible, [role="button"]:focus-visible { outline: 3px solid #17305f; outline-offset: 3px; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .column { min-width: 0; }
    .column h2 { margin-bottom: 12px; font-size: 20px; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .picture-target, .match-tile {
      min-width: 0;
      min-height: 132px;
      padding: 9px;
      border: 2px solid var(--line);
      border-bottom-width: 5px;
      border-radius: 16px;
      background: #fff;
      transition: background .15s ease, border-color .15s ease;
    }
    .picture-target { cursor: pointer; }
    .picture-target img { display: block; width: 100%; height: 100px; object-fit: contain; }
    .picture-target.is-selected, .match-tile.is-selected, .picture-target.is-over { border-color: var(--blue); background: #ddf4ff; }
    .picture-target.is-correct { border-color: var(--green); background: #e9f9dc; cursor: default; }
    .matched-word { display: block; margin-top: 4px; color: #347900; font-weight: 900; }
    .match-tile { display: flex; align-items: center; justify-content: center; color: var(--ink); font: inherit; text-align: center; cursor: grab; user-select: none; }
    .match-tile:active { cursor: grabbing; }
    .match-tile.is-matched { display: none; }
    .word-tile { font-size: 19px; font-weight: 900; overflow-wrap: anywhere; }
    .audio-choice { flex-direction: column; gap: 7px; }
    .audio-choice { color: #087fb5; font-size: 28px; }
    .match-message { min-height: 26px; margin: 18px 0 0; font-weight: 900; text-align: center; }
    .match-message.is-error { color: var(--red); }
    .match-message.is-success { color: #347900; }
    .finished { padding: 28px 16px; border-radius: 18px; background: #e9f9dc; text-align: center; }
    .finished h2 { margin-bottom: 8px; color: #347900; font-size: 28px; }
    .hidden { display: none !important; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .picture-target.is-wrong { border-color: #ff4b4b; animation: shake .22s linear; }
    @media (max-width: 700px) {
      body { padding: 12px; place-items: start center; }
      .game { padding: 16px; }
      .board { grid-template-columns: 1fr; gap: 22px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="game">
    <section class="set-picker" id="setSelectionScreen" aria-labelledby="setSelectionTitle">
      <h1 id="setSelectionTitle">Choose a vocabulary set</h1>
      <p class="instructions">Choose one of the numbered sets to start practicing.</p>
      {% if set_groups %}
      <label for="setSelect">Vocabulary set</label>
      <select id="setSelect">
      {% for table_id, sets in set_groups.items() %}
      <optgroup label="Table {{ table_id }}">
        {% for set in sets %}
        <option value="{{ set.id }}"{% if not set.word_count %} disabled{% endif %}>{{ set.title }} · {% if set.word_count %}{{ set.word_count }} words{% else %}no playable media{% endif %}</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
      </select>
      <button class="primary" id="startButton" type="button">Start set</button>
      {% else %}
      <p>No vocabulary sets currently have both playable images and audio.</p>
      {% endif %}
      <p class="set-error" id="setError" role="status" aria-live="polite"></p>
    </section>

    <div id="gameScreen" class="hidden">
      <header class="header">
        <span class="stage" id="stageLabel">Phase 1</span>
        <div class="progress" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </header>

      <section id="learningScreen" aria-labelledby="phaseTitle">
        <h1 id="phaseTitle"></h1>
        <p class="instructions" id="learnInstructions"></p>
        <div class="learn-card">
          <div class="learn-images" id="learnImages"></div>
          <p class="learn-word" id="learnWord"></p>
          <button class="audio-button" id="learnAudioButton" type="button">▶ <span id="learnAudioLabel">Play English audio</span></button>
          <button class="primary" id="nextButton" type="button">Next</button>
        </div>
      </section>

      <section id="matchingScreen" class="hidden" aria-labelledby="matchingTitle">
        <h1 id="matchingTitle"></h1>
        <p class="instructions" id="matchInstructions"></p>
        <div class="board">
          <section class="column" aria-labelledby="picturesHeading">
            <h2 id="picturesHeading">Pictures</h2>
            <div class="grid" id="pictureGrid"></div>
          </section>
          <section class="column" aria-labelledby="choicesHeading">
            <h2 id="choicesHeading"></h2>
            <div class="grid" id="choiceGrid"></div>
          </section>
        </div>
        <p class="match-message" id="matchMessage" role="status" aria-live="polite"></p>
        <div class="finished hidden" id="finishedPanel" role="status">
          <h2 id="finishedTitle">Great work!</h2>
          <p id="finishedText"></p>
          <button class="primary" id="continueButton" type="button"></button>
        </div>
      </section>
      <p id="audioStatus" class="match-message" role="status" aria-live="polite"></p>
    </div>
  </main>

  <audio id="audioPlayer" preload="none"></audio>
  <script>
    let vocabItems = [];
    const batchSize = 5;
    let phaseTotalProgress = 0;
    const phaseTitle = document.getElementById("phaseTitle");
    const stageLabel = document.getElementById("stageLabel");
    const progressFill = document.getElementById("progressFill");
    const progressOuter = document.querySelector(".progress");
    const setSelectionScreen = document.getElementById("setSelectionScreen");
    const gameScreen = document.getElementById("gameScreen");
    const setSelect = document.getElementById("setSelect");
    const startButton = document.getElementById("startButton");
    const setError = document.getElementById("setError");
    const learningScreen = document.getElementById("learningScreen");
    const matchingScreen = document.getElementById("matchingScreen");
    const learnInstructions = document.getElementById("learnInstructions");
    const learnImages = document.getElementById("learnImages");
    const learnWord = document.getElementById("learnWord");
    const learnAudioButton = document.getElementById("learnAudioButton");
    const nextButton = document.getElementById("nextButton");
    const matchingTitle = document.getElementById("matchingTitle");
    const matchInstructions = document.getElementById("matchInstructions");
    const choicesHeading = document.getElementById("choicesHeading");
    const pictureGrid = document.getElementById("pictureGrid");
    const choiceGrid = document.getElementById("choiceGrid");
    const matchMessage = document.getElementById("matchMessage");
    const finishedPanel = document.getElementById("finishedPanel");
    const finishedTitle = document.getElementById("finishedTitle");
    const finishedText = document.getElementById("finishedText");
    const continueButton = document.getElementById("continueButton");
    const audioPlayer = document.getElementById("audioPlayer");
    const audioStatus = document.getElementById("audioStatus");
    let phaseIndex = 0;
    let batchIndex = 0;
    let learnIndex = 0;
    let matchedCount = 0;
    let selectedChoiceId = null;
    let selectedPictureId = null;

    function itemsInCurrentRound() {
      return vocabItems.slice(0, Math.min((batchIndex + 1) * batchSize, vocabItems.length));
    }

    function currentBatchSize() {
      return Math.min(batchSize, vocabItems.length - batchIndex * batchSize);
    }

    function matchingProgressBeforeRound() {
      return Array.from({ length: batchIndex }, (_, index) =>
        Math.min((index + 1) * batchSize, vocabItems.length)
      ).reduce((total, count) => total + count, 0);
    }

    function updateProgress(completed, label) {
      stageLabel.textContent = label;
      progressFill.style.width = `${(completed / (phaseTotalProgress * 2)) * 100}%`;
      progressOuter.setAttribute("aria-valuenow", String(completed));
    }

    function playAudio(source) {
      audioStatus.textContent = "";
      audioPlayer.src = source;
      audioPlayer.play().catch(() => {
        audioStatus.textContent = "Audio could not be played. Please try again.";
      });
    }

    function currentPhaseLabel() {
      return phaseIndex === 0 ? "Phase 1 · Words + audio" : "Phase 2 · Audio only";
    }

    function showLearningItem() {
      const firstIndex = batchIndex * batchSize;
      const item = vocabItems[firstIndex + learnIndex];
      const isAudioOnly = phaseIndex === 1;
      const completedBefore = phaseIndex * phaseTotalProgress
        + batchIndex * batchSize
        + matchingProgressBeforeRound()
        + learnIndex + 1;

      learningScreen.classList.remove("hidden");
      matchingScreen.classList.add("hidden");
      phaseTitle.textContent = currentPhaseLabel();
      learnInstructions.textContent = isAudioOnly
        ? "Look at each picture and listen. No written vocabulary is shown in this phase."
        : "Read the English word, look at the picture, and listen to the audio.";
      learnImages.replaceChildren();
      item.images.forEach(source => {
        const image = document.createElement("img");
        image.src = source;
        image.alt = isAudioOnly ? "Vocabulary picture" : item.english;
        image.decoding = "async";
        learnImages.appendChild(image);
      });
      learnWord.textContent = isAudioOnly ? "" : item.english;
      learnWord.hidden = isAudioOnly;
      learnAudioButton.setAttribute("aria-label", "Play English audio");
      learnAudioButton.onclick = () => playAudio(item.audio);
      nextButton.textContent = learnIndex === Math.min(batchSize, vocabItems.length - firstIndex) - 1
        ? "Start matching"
        : "Next";
      updateProgress(completedBefore, `${currentPhaseLabel()} · Learn ${learnIndex + 1} / ${Math.min(batchSize, vocabItems.length - firstIndex)}`);
    }

    function shuffled(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function matches(choice, picture) {
      return choice.id === picture.id;
    }

    function selectChoice(choiceId, element) {
      selectedChoiceId = choiceId;
      document.querySelectorAll(".match-tile").forEach(tile => tile.classList.remove("is-selected"));
      element.classList.add("is-selected");
      matchMessage.textContent = phaseIndex === 0
        ? "English word selected. Choose its picture."
        : "Audio selected. Choose its picture.";
      matchMessage.className = "match-message";
    }

    function selectPicture(pictureId, element) {
      selectedPictureId = pictureId;
      document.querySelectorAll(".picture-target").forEach(target => target.classList.remove("is-selected"));
      element.classList.add("is-selected");
      if (selectedChoiceId) {
        tryMatch(selectedChoiceId, pictureId);
      }
    }

    function tryMatch(choiceId, pictureId) {
      const choice = vocabItems.find(item => item.id === choiceId);
      const picture = vocabItems.find(item => item.id === pictureId);
      const target = pictureGrid.querySelector(`[data-picture-id="${CSS.escape(pictureId)}"]`);
      const tile = choiceGrid.querySelector(`[data-choice-id="${CSS.escape(choiceId)}"]`);
      if (!choice || !picture || !target || !tile || target.classList.contains("is-correct")) return;

      if (!matches(choice, picture)) {
        matchMessage.textContent = "Not a match. Try again.";
        matchMessage.className = "match-message is-error";
        target.classList.remove("is-wrong");
        void target.offsetWidth;
        target.classList.add("is-wrong");
        window.setTimeout(() => target.classList.remove("is-wrong"), 300);
        return;
      }

      target.classList.add("is-correct");
      target.classList.remove("is-selected");
      target.setAttribute("aria-label", phaseIndex === 0 ? `${picture.english}, matched` : "Picture matched");
      if (phaseIndex === 0) {
        const matchedWord = document.createElement("span");
        matchedWord.className = "matched-word";
        matchedWord.textContent = picture.english;
        target.appendChild(matchedWord);
      }
      tile.classList.add("is-matched");
      selectedChoiceId = null;
      selectedPictureId = null;
      matchedCount++;
      matchMessage.textContent = phaseIndex === 0 ? `Correct: ${picture.english}!` : "Correct match!";
      matchMessage.className = "match-message is-success";
      updateProgress(
        phaseIndex * phaseTotalProgress + batchIndex * batchSize
          + currentBatchSize() + matchingProgressBeforeRound() + matchedCount,
        `${currentPhaseLabel()} · Match ${matchedCount} / ${itemsInCurrentRound().length}`
      );

      if (matchedCount === itemsInCurrentRound().length) {
        matchMessage.classList.add("hidden");
        finishedPanel.classList.remove("hidden");
        const isLastBatch = (batchIndex + 1) * batchSize >= vocabItems.length;
        const isGameComplete = phaseIndex === 1 && isLastBatch;
        finishedTitle.textContent = isGameComplete ? "Both phases complete!" : "Great work!";
        finishedText.textContent = isGameComplete
          ? "You finished every word in both matching phases."
          : "You matched every picture in this round.";
        continueButton.textContent = isGameComplete
          ? "Play again"
          : phaseIndex === 0 && isLastBatch
            ? "Start audio-only phase"
            : "Next five words";
        updateProgress(
          phaseIndex * phaseTotalProgress + batchIndex * batchSize
            + currentBatchSize() + matchingProgressBeforeRound() + matchedCount,
          isGameComplete ? "Complete" : `${currentPhaseLabel()} · Round complete`
        );
      }
    }

    function renderMatchItems() {
      const isAudioOnly = phaseIndex === 1;
      const roundItems = itemsInCurrentRound();
      pictureGrid.replaceChildren();
      choiceGrid.replaceChildren();
      finishedPanel.classList.add("hidden");
      matchMessage.classList.remove("hidden");
      matchedCount = 0;
      selectedChoiceId = null;
      selectedPictureId = null;
      matchingTitle.textContent = isAudioOnly ? "Match the audio" : "Match the English word";
      matchInstructions.textContent = isAudioOnly
        ? "Drag an audio tile onto its picture, or tap an audio tile and then a picture."
        : "Drag an English word onto its picture, or tap a word and then a picture.";
      choicesHeading.textContent = isAudioOnly ? "Audio" : "English words";

      roundItems.forEach((item, index) => {
        const target = document.createElement("button");
        target.type = "button";
        target.className = "picture-target";
        target.dataset.pictureId = item.id;
        target.setAttribute("aria-label", `Picture ${index + 1}, select to match.`);
        item.images.forEach(source => {
          const image = document.createElement("img");
          image.src = source;
          image.alt = "";
          image.loading = "lazy";
          image.decoding = "async";
          target.appendChild(image);
        });
        target.addEventListener("click", () => selectPicture(item.id, target));
        target.addEventListener("dragover", event => event.preventDefault());
        target.addEventListener("dragenter", () => target.classList.add("is-over"));
        target.addEventListener("dragleave", () => target.classList.remove("is-over"));
        target.addEventListener("drop", event => {
          event.preventDefault();
          target.classList.remove("is-over");
          const choiceId = event.dataTransfer.getData("text/plain");
          if (choiceId) tryMatch(choiceId, item.id);
        });
        pictureGrid.appendChild(target);
      });

      shuffled(roundItems).forEach((item, index) => {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = `match-tile${isAudioOnly ? " audio-choice" : " word-tile"}`;
        tile.dataset.choiceId = item.id;
        tile.draggable = true;
        tile.setAttribute("aria-label", isAudioOnly
          ? `Play and select audio option ${index + 1}. Drag to match.`
          : item.english);
        if (isAudioOnly) {
          tile.innerHTML = '<span aria-hidden="true">▶</span>';
        } else {
          tile.textContent = item.english;
        }
        tile.addEventListener("click", () => {
          if (isAudioOnly) playAudio(item.audio);
          selectChoice(item.id, tile);
        });
        tile.addEventListener("dragstart", event => {
          event.dataTransfer.setData("text/plain", item.id);
          event.dataTransfer.effectAllowed = "move";
        });
        choiceGrid.appendChild(tile);
      });

      matchingScreen.classList.remove("hidden");
      learningScreen.classList.add("hidden");
      updateProgress(
        phaseIndex * phaseTotalProgress + batchIndex * batchSize + currentBatchSize()
          + matchingProgressBeforeRound(),
        `${currentPhaseLabel()} · Match 0 / ${roundItems.length}`
      );
    }

    nextButton.addEventListener("click", () => {
      const lastNewItem = Math.min(batchSize, vocabItems.length - batchIndex * batchSize) - 1;
      if (learnIndex === lastNewItem) {
        renderMatchItems();
        return;
      }
      learnIndex++;
      showLearningItem();
    });

    continueButton.addEventListener("click", () => {
      if (phaseIndex === 1 && (batchIndex + 1) * batchSize >= vocabItems.length) {
        window.location.reload();
        return;
      }
      const lastBatch = (batchIndex + 1) * batchSize >= vocabItems.length;
      if (lastBatch && phaseIndex === 0) {
        phaseIndex = 1;
        batchIndex = 0;
      } else {
        batchIndex++;
      }
      learnIndex = 0;
      showLearningItem();
    });

    if (startButton) {
      startButton.addEventListener("click", async () => {
        if (!setSelect.value) return;
        startButton.disabled = true;
        setError.textContent = "";
        try {
          const response = await fetch(
            `/vocab/api/get-set-details?id=${encodeURIComponent(setSelect.value)}`
          );
          if (!response.ok) {
            throw new Error(`Unable to load this vocabulary set (HTTP ${response.status}).`);
          }
          const words = await response.json();
          if (!Array.isArray(words) || words.length === 0) {
            throw new Error("This set does not currently have playable vocabulary.");
          }
          vocabItems = words;
          const batchCount = Math.ceil(vocabItems.length / batchSize);
          const totalMatchSteps = Array.from({ length: batchCount }, (_, index) =>
            Math.min((index + 1) * batchSize, vocabItems.length)
          ).reduce((total, count) => total + count, 0);
          phaseTotalProgress = vocabItems.length + totalMatchSteps;
          progressOuter.setAttribute("aria-valuemax", String(phaseTotalProgress * 2));
          phaseIndex = 0;
          batchIndex = 0;
          learnIndex = 0;
          setSelectionScreen.classList.add("hidden");
          gameScreen.classList.remove("hidden");
          showLearningItem();
        } catch (error) {
          setError.textContent = error.message;
        } finally {
          startButton.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
