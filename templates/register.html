<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create student account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="registration-page">
    <main class="login-container">
        <section class="login-card registration-card">
            <h1>Create student account</h1>
            <p>Use the same account across the site.</p>
            {% if message %}<p>{{ message }}</p>{% endif %}
            <form method="post" autocomplete="on">
                <input name="name" placeholder="Name" required>
                <input name="last_name" placeholder="Last name" required>
                <input name="email" type="email" autocomplete="username" placeholder="Email" required>
                <input name="password" type="password" autocomplete="new-password" placeholder="Password" required>
                <button type="submit">Create account</button>
            </form>
            <p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
        </section>
    </main>
</body>
</html>
