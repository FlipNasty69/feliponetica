<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0A1A2F">
    <title>Test Center | English Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/test_center.css') }}">
</head>
<body class="test-page">
    <main class="test-shell landing-shell">
        <header class="test-header">
            <a class="test-brand" href="{{ url_for('course') }}">English<span>Course</span></a>
            <a class="quiet-link" href="{{ url_for('course') }}">Back to course</a>
        </header>
        <section class="landing-content" aria-labelledby="test-center-title">
            <p class="test-kicker">ASSESSMENT · 01</p>
            <h1 id="test-center-title">Test Center</h1>
            <p class="landing-copy">Choose an assessment to begin. Your results are sent privately for review.</p>
            <div class="test-selection">
                <a class="test-option tactile-button" href="{{ url_for('final_english_register') }}">
                    <span class="option-index">01</span>
                    <span class="option-copy">
                        <strong>Final English Test</strong>
                        <span>100 questions · Multiple choice</span>
                    </span>
                    <span class="option-arrow" aria-hidden="true">→</span>
                </a>
            </div>
        </section>
        <footer class="test-footer">A focused assessment experience</footer>
    </main>
</body>
</html>
