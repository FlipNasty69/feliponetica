<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse class photos from our classroom.">
    <title>Picture Gallery | English Course</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
</head>
<body class="gallery-page">
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="logo">English<span>Course</span></a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('course') }}">Course</a>
                <a href="{{ url_for('lessons') }}">Lessons</a>
                <a href="{{ url_for('gallery.gallery_page') }}" aria-current="page">Gallery</a>
                <a href="{{ url_for('games_dashboard') }}">Games</a>
            </div>
        </div>
    </nav>

    <main class="gallery-main">
        <header class="gallery-heading">
            <p class="gallery-eyebrow">Our classroom</p>
            <h1>Picture Gallery</h1>
            <p>Browse our class photos. Select any image to view it full size.</p>
        </header>

        <section class="gallery-grid" aria-label="Pictures">
            {% for item in gallery_items %}
            <button
                class="gallery-card"
                type="button"
                data-full-image="{{ item.image_url }}"
                data-image-name="{{ item.name }}"
                {% if loop.index > 12 %}hidden{% endif %}
                aria-label="View {{ item.name }} full size">
                <img
                    data-src="{{ item.thumbnail_url }}"
                    alt="{{ item.name }}"
                    width="{{ item.width }}"
                    height="{{ item.height }}"
                    loading="lazy"
                    decoding="async">
                <noscript>
                    <img
                        src="{{ item.thumbnail_url }}"
                        alt="{{ item.name }}"
                        width="{{ item.width }}"
                        height="{{ item.height }}">
                </noscript>
                <span class="gallery-card-caption">{{ item.name }}</span>
            </button>
            {% endfor %}
        </section>
        <button id="gallery-load-more" class="gallery-load-more" type="button" hidden>
            Show more pictures
        </button>
    </main>

    <dialog class="gallery-dialog" aria-label="Full-size picture viewer">
        <button class="gallery-dialog-close" type="button" aria-label="Close picture viewer">&times;</button>
        <img class="gallery-dialog-image" alt="">
        <p class="gallery-dialog-caption"></p>
    </dialog>

    <script src="{{ url_for('static', filename='scripts/gallery.js') }}" defer></script>
</body>
</html>
